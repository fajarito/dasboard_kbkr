server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # OpenShift / k8s probes
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA (React Router BrowserRouter) — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; HTML stays revalidated
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # GeoJSON / static public data
    location /data/ {
        try_files $uri =404;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;
}
